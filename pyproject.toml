[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "svweave"
version = "0.1.0"
description = "Build-aware SystemVerilog/UVM analysis and controlled-edit gateway"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
    "click==8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "hypothesis==6.169.0",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "types-PyYAML==6.0.12.20260906",
    "types-jsonschema==4.26.0.20261006",
]

[project.scripts]
svweave = "svweave.cli:main"
svweave-mcp = "svweave.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/svweave"]

# Ship the reviewed bytes from their authoritative source locations, without a second
# checked-in copy. Native backends still come from the pinned shared bootstrap install.
[tool.hatch.build.targets.wheel.force-include]
"toolchain.lock.json" = "svweave/_runtime/toolchain.lock.json"
"capability_report.json" = "svweave/_runtime/capability_report.json"
"license_manifest.json" = "svweave/_runtime/license_manifest.json"
"THIRD_PARTY_NOTICES.md" = "svweave/_runtime/THIRD_PARTY_NOTICES.md"
# Exact reviewed fixture files only: never bundle runtime/private debris in fixture directories.
"fixtures/demo/filelists/rtl.f" = "svweave/_runtime/fixtures/demo/filelists/rtl.f"
"fixtures/demo/include/demo_defs.svh" = "svweave/_runtime/fixtures/demo/include/demo_defs.svh"
"fixtures/demo/rtl/demo_lane.sv" = "svweave/_runtime/fixtures/demo/rtl/demo_lane.sv"
"fixtures/demo/rtl/demo_top.sv" = "svweave/_runtime/fixtures/demo/rtl/demo_top.sv"
"fixtures/demo/sva/demo_bind.sv" = "svweave/_runtime/fixtures/demo/sva/demo_bind.sv"
"fixtures/demo/sva/stream_hold_sva.sv" = "svweave/_runtime/fixtures/demo/sva/stream_hold_sva.sv"
"fixtures/uvm/svw_demo_uvm_pkg.sv" = "svweave/_runtime/fixtures/uvm/svw_demo_uvm_pkg.sv"
"fixtures/uvm/svw_uvm_cfgdb_pkg.sv" = "svweave/_runtime/fixtures/uvm/svw_uvm_cfgdb_pkg.sv"
"fixtures/uvm/svw_uvm_ext_top.sv" = "svweave/_runtime/fixtures/uvm/svw_uvm_ext_top.sv"
"fixtures/uvm/svw_uvm_override_pkg.sv" = "svweave/_runtime/fixtures/uvm/svw_uvm_override_pkg.sv"
"fixtures/uvm/svw_uvm_static_calls.sv" = "svweave/_runtime/fixtures/uvm/svw_uvm_static_calls.sv"
"fixtures/uvm/svw_uvm_top.sv" = "svweave/_runtime/fixtures/uvm/svw_uvm_top.sv"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Owned by the M0 spike work; not linted by M1 config.
extend-exclude = ["scripts/spikes", "scripts/probe_backends.py", "scripts/bootstrap_locked.py", ".toolchain", ".svweave", "evidence", "fixtures/demo", "fixtures/uvm"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src/svweave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=svweave --cov-report=term-missing:skip-covered"
markers = ["integration: uses the real pinned backends (pyslang worker, UVM library, ...)"]

[tool.coverage.run]
source = ["svweave"]
branch = false
