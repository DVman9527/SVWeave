<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1110" width="100%" role="img" aria-labelledby="t d">
<title id="t">SVWeave installation and supply chain</title>
<desc id="d">Three install paths feed one installer. (a) Online: python3.12 scripts/bootstrap_locked.py --create-venv downloads every artifact of the lock. (b) GitHub reachable but not PyPI: the committed vendor/ package is checked with sha256sum -c SHA256SUMS run inside vendor/, the uv cache, the Serena git bundle and a standalone CPython 3.12.15 are unpacked into .toolchain/state, .toolchain/serena-src and .toolchain/runtime, and the installer runs with --artifact-dir vendor/downloads --create-venv --python .toolchain/runtime/python/bin/python3; slang, Verible, codebase-memory-mcp and uvm-core are still downloaded from GitHub and verified. (c) Fully offline: --fetch-only on a connected host fills the artifact cache, the Serena checkout and the uv cache, the repository with .toolchain/ is copied, and --offline --create-venv --venv-dir .venv installs from the cache only. The installer, scripts/bootstrap_locked.py driven by toolchain.lock.json, runs in order: the pinned uv 0.12.23 (tarball and extracted binary verified, then used for every uv command), the backend archives (sha256 before extraction, path traversal rejected, binaries verified again), the gateway venv (created by the installer on python3.12 or --python, 31 hash-locked wheels with --no-index --require-hashes, source tree linked in), and Serena v1.7.0 (pinned commit, 8 hash-pinned build wheels, uv sync --frozen --no-dev --no-build-isolation). Success prints a JSON report with ok true and exit 0; a failure gives ok false and exit 2. The result is .toolchain/ with uv, runtime, slang, verible, cbm, uvm-core, serena-src, serena-venv, state and downloads, plus the gateway .venv. Then bootstrap_locked.py --verify-only, svweave init (trusted policy outside the repository), svweave doctor, svweave doctor --probe and the demo build.</desc>
