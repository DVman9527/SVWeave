<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" width="100%" role="img" aria-labelledby="t d">
<title id="t">Backend sandbox and transport bounds</title>
<desc id="d">Left, the gateway: the SandboxRunner builds a bwrap argument array (never a shell string) and refuses to start a backend without bwrap unless degraded mode was explicitly allowed and flagged; the MCP client talks to the backend over a bounded stdio transport that reads stdout in 64 KiB chunks and accepts at most 16 MiB per JSON-RPC message and 16 Mi characters per tool result. On an overflow the backend's process group is terminated first (SIGTERM, then SIGKILL); then the call fails with BACKEND_UNAVAILABLE message_too_large or OUTPUT_LIMIT result_too_large, and other calls on that backend fail with BACKEND_UNAVAILABLE backend_terminated. Stderr goes to a host-only log. Right, the bwrap sandbox around one backend process (codebase-memory-mcp, Serena with Verible, or the pyslang worker): --die-with-parent, --new-session, --unshare-user, -pid, -ipc, -uts, --unshare-cgroup-try and --unshare-net; /usr bound read-only with /bin, /sbin, /lib and /lib64 as symlinks into it; only a minimal list of /etc files; /proc and /dev; a private tmpfs /tmp, where codebase-memory-mcp gets the short socket directory /tmp/cbm-rt because a unix socket path must fit the about 108-byte sockaddr_un limit. Read-only binds: the pinned toolchain or venv, the interpreter's executable, stdlib and libpython, and the snapshot; the interpreter's intermediate symlinks are recreated with --symlink only where no mount already shows them (mount_providing). Read-write binds: only the candidate copy (Serena) and the backend's own work directory. The original source is a protected path and never writable; system directories and $HOME are refused as writable binds. The environment is cleared with /usr/bin/env -i and set from an explicit allowlist.</desc>
