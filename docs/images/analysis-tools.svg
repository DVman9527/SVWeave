<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" role="img" aria-labelledby="t d">
<title id="t">SVWeave analysis tools</title>
<desc id="d">One published build, identified by build_id, holds the immutable snapshot bytes, the elaborated instance tree under the tops, the declarations with their resolved references, and the direct port associations. Four tools read it. Impact (svw_impact, svweave query impact) takes one declaration or instance and returns, for a module or interface, its instances, dependents up to --depth and dependencies; for a port, its connection sites and dependents; for a net, variable or parameter, its resolved references and port connections; for an instance, its ancestors, subtree and connections. Diff impact (svw_diff_impact, svweave query diff-impact) reads git diff -U0 from --base (HEAD) to --head (the working tree), maps the old-side lines onto the snapshot bytes and returns the changed declarations, their modules' instances and dependents, and changed ports with their connection sites, per file aligned or flagged approximate. Rename preview (svw_rename_preview, svweave query rename-preview) is read-only: it lists every edit, each verified against the snapshot bytes, plus a diff, blockers, warnings and a lexical scan of other occurrences, and returns an edit_request for the controlled edit loop when nothing blocks. Graph export (svweave graph export, CLI only) writes one static HTML file with the instance tree and the connections derived from port associations. Every answer is one envelope with build_id, completeness, freshness and limitations; counts are not risk scores and absence from a partial, stale or truncated answer is not proof of absence.</desc>
