<rect width="1200" height="850" class="bg"/>
<text x="40" y="32" class="tx b s16">Analysis tools: four read-only views of one published build</text>
<text x="1160" y="32" class="mu s12" text-anchor="end">nothing here writes the source tree</text>
<rect x="40" y="52" width="1120" height="118" rx="8" class="a"/>
<text x="52" y="74" class="ta b s14">One build: build_id = hash(snapshot_id, config_id, toolchain_id, schema version)</text>
<text x="1148" y="74" class="mu s12" text-anchor="end">COMPLETE or PARTIAL; CURRENT, STALE or HISTORICAL</text>
<rect x="56" y="88" width="260" height="70" rx="8" class="chip"/>
<text x="68" y="108" class="tx b s13">immutable snapshot</text>
<text x="68" y="128" class="mu s12">bytes + inventory of every</text>
<text x="68" y="146" class="mu s12">input file at build time</text>
<rect x="332" y="88" width="260" height="70" rx="8" class="chip"/>
<text x="344" y="108" class="tx b s13">instance tree</text>
<text x="344" y="128" class="mu s12">elaborated by slang under</text>
<text x="344" y="146" class="mu s12">the profile's tops</text>
<rect x="608" y="88" width="260" height="70" rx="8" class="chip"/>
<text x="620" y="108" class="tx b s13">declarations + references</text>
<text x="620" y="128" class="mu s12">statically resolved by slang;</text>
<text x="620" y="146" class="mu s12">unresolved ones are listed</text>
<rect x="884" y="88" width="260" height="70" rx="8" class="chip"/>
<text x="896" y="108" class="tx b s13">port associations</text>
<text x="896" y="128" class="mu s12">direct port connections:</text>
<text x="896" y="146" class="mu s12">actual expression, signals</text>
<path d="M172,170 L172,214" class="l" marker-end="url(#mg)"/>
<path d="M457,170 L457,214" class="l" marker-end="url(#mg)"/>
<path d="M742,170 L742,214" class="l" marker-end="url(#mg)"/>
<path d="M1027,170 L1027,214" class="l" marker-end="url(#mg)"/>
<text x="180" y="198" class="mu s12">tree, references, ports</text>
<text x="465" y="198" class="mu s12">bytes, declarations, tree</text>
<text x="750" y="198" class="mu s12">references, bytes</text>
<text x="1035" y="198" class="mu s12">tree, ports</text>
<rect x="40" y="214" width="265" height="440" rx="8" class="n"/>
<text x="52" y="236" class="tx b s14">Impact</text>
<text x="52" y="256" class="tx s12 mono">svw_impact</text>
<text x="52" y="275" class="tx s12 mono">svweave query impact</text>
<text x="52" y="298" class="ta b s12">input: one target</text>
<text x="52" y="317" class="mu s12">--name, --symbol, --file + --byte,</text>
<text x="52" y="335" class="mu s12">or --instance; --depth</text>
<text x="52" y="357" class="ta b s12">returns</text>
<text x="52" y="376" class="mu s12">module / interface: every</text>
<text x="52" y="394" class="mu s12">instance, dependents (up to</text>
<text x="52" y="412" class="mu s12">--depth), dependencies, refs</text>
<text x="52" y="430" class="mu s12">port: each connection site</text>
<text x="52" y="448" class="mu s12">(actual, signals, file:line),</text>
<text x="52" y="466" class="mu s12">uses further down, dependents</text>
<text x="52" y="484" class="mu s12">net, variable, parameter:</text>
<text x="52" y="502" class="mu s12">resolved refs, connections</text>
<text x="52" y="520" class="mu s12">instance: ancestors, subtree,</text>
<text x="52" y="538" class="mu s12">its own port connections</text>
<text x="52" y="560" class="tw b s12">limits</text>
<text x="52" y="579" class="mu s12">ambiguous name:</text>
<text x="52" y="597" class="mu s12">AMBIGUOUS_SYMBOL + candidates</text>
<text x="52" y="615" class="mu s12">never-instantiated module:</text>
<text x="52" y="633" class="mu s12">no dependents in this build</text>
<rect x="325" y="214" width="265" height="440" rx="8" class="n"/>
<text x="337" y="236" class="tx b s14">Git diff impact</text>
<text x="337" y="256" class="tx s12 mono">svw_diff_impact</text>
<text x="337" y="275" class="tx s12 mono">svweave query diff-impact</text>
<text x="337" y="298" class="ta b s12">input: git diff -U0</text>
<text x="337" y="317" class="mu s12">--base (HEAD) to --head</text>
<text x="337" y="335" class="mu s12">(default: the working tree);</text>
<text x="337" y="353" class="mu s12">fixed argv, no shell, size cap</text>
<text x="337" y="375" class="ta b s12">maps OLD-side lines</text>
<text x="337" y="394" class="mu s12">onto the snapshot bytes:</text>
<text x="337" y="412" class="mu s12">per file aligned (bytes equal</text>
<text x="337" y="430" class="mu s12">the base) or approximate</text>
<text x="337" y="452" class="ta b s12">returns</text>
<text x="337" y="471" class="mu s12">changed declarations, their</text>
<text x="337" y="489" class="mu s12">modules' instances and</text>
<text x="337" y="507" class="mu s12">dependents; changed ports</text>
<text x="337" y="525" class="mu s12">with their connection sites</text>
<text x="337" y="547" class="tw b s12">limits</text>
<text x="337" y="566" class="mu s12">files outside the build: listed</text>
<text x="337" y="584" class="mu s12">headers: no re-expansion</text>
<text x="337" y="602" class="mu s12">STALE by definition, exit</text>
<text x="337" y="620" class="mu s12">code unchanged</text>
<rect x="610" y="214" width="265" height="440" rx="8" class="n"/>
<text x="622" y="236" class="tx b s14">Rename preview</text>
<text x="622" y="256" class="tx s12 mono">svw_rename_preview</text>
<text x="622" y="275" class="tx s12 mono">svweave query rename-preview</text>
<text x="622" y="298" class="ta b s12">edit set, each span verified</text>
<text x="622" y="317" class="mu s12">declaration, resolved refs,</text>
<text x="622" y="335" class="mu s12">.old(expr) formal names,</text>
<text x="622" y="353" class="mu s12">end-label, bind targets;</text>
<text x="622" y="371" class="mu s12">bytes at the span = old name</text>
<text x="622" y="393" class="ta b s12">returns (read-only)</text>
<text x="622" y="412" class="mu s12">diff, blockers, warnings,</text>
<text x="622" y="430" class="mu s12">other lexical occurrences,</text>
<text x="622" y="448" class="mu s12">edit_request when ready</text>
<text x="622" y="470" class="tw b s12">blocks rather than guesses</text>
<text x="622" y="489" class="mu s12">unresolved refs, .* and .name,</text>
<text x="622" y="507" class="mu s12">macro sites, name collision,</text>
<text x="622" y="525" class="mu s12">build not COMPLETE + CURRENT,</text>
<text x="622" y="543" class="mu s12">named parameter overrides</text>
<rect x="895" y="214" width="265" height="440" rx="8" class="n"/>
<text x="907" y="236" class="tx b s14">Graph export</text>
<text x="907" y="256" class="tx s12 mono">svweave graph export</text>
<text x="907" y="275" class="tx s12 mono">--build B   (CLI only)</text>
<text x="907" y="298" class="ta b s12">writes one static file</text>
<text x="907" y="317" class="mu s12">.svweave/exports/</text>
<text x="907" y="335" class="mu s12">graph-&lt;build&gt;.html</text>
<text x="907" y="357" class="ta b s12">shows</text>
<text x="907" y="376" class="mu s12">instance tree (collapse,</text>
<text x="907" y="394" class="mu s12">search, pan and zoom);</text>
<text x="907" y="412" class="mu s12">dashed: two instances use the</text>
<text x="907" y="430" class="mu s12">same signal declaration in a</text>
<text x="907" y="448" class="mu s12">direct port association,</text>
<text x="907" y="466" class="mu s12">oriented by port direction</text>
<text x="907" y="488" class="tw b s12">bounds</text>
<text x="907" y="507" class="mu s12">hubs over --max-fanout (16)</text>
<text x="907" y="525" class="mu s12">listed, not drawn; at most</text>
<text x="907" y="543" class="mu s12">--max-instances (5000),</text>
<text x="907" y="561" class="mu s12">shallowest first</text>
<text x="907" y="579" class="mu s12">file://, strict CSP, no server;</text>
<text x="907" y="597" class="mu s12">not a netlist</text>
<path d="M172,654 L172,694" class="l" marker-end="url(#mg)"/>
<path d="M457,654 L457,694" class="l" marker-end="url(#mg)"/>
<rect x="40" y="694" width="550" height="90" rx="8" class="n"/>
<text x="52" y="716" class="tx b s14">JSON envelope (CLI and MCP alike)</text>
<text x="52" y="738" class="mu s12">build_id, snapshot_id, completeness, freshness, limitations;</text>
<text x="52" y="757" class="mu s12">lists capped with complete totals; counts, never a risk score</text>
<path d="M742,654 L742,694" class="la" marker-end="url(#ma)"/>
<text x="750" y="680" class="ta s12">edit_request</text>
<rect x="610" y="694" width="265" height="90" rx="8" class="a"/>
<text x="622" y="716" class="ta b s14">Controlled edit loop</text>
<text x="622" y="738" class="mu s12">edit prepare --spec: candidate,</text>
<text x="622" y="757" class="mu s12">slang check, human approval</text>
<path d="M1027,654 L1027,694" class="l" marker-end="url(#mg)"/>
<rect x="895" y="694" width="265" height="90" rx="8" class="n"/>
<text x="907" y="716" class="tx b s14">Browser, from disk</text>
<text x="907" y="738" class="mu s12">completeness and freshness</text>
<text x="907" y="757" class="mu s12">are shown on the page</text>
<text x="40" y="816" class="mu s12">Absence from a PARTIAL, STALE or truncated answer is not proof of absence. Details: the four subsections below and ADR-014.</text>
</svg>
