<rect width="1200" height="980" class="bg"/>
<text x="40" y="32" class="tx b s16">Evidence kinds: what each one can and cannot support</text>
<text x="52" y="66" class="mu b s12">evidence kind</text>
<text x="272" y="66" class="mu b s12">can support</text>
<text x="722" y="66" class="mu b s12">cannot support</text>
<rect x="40" y="76" width="1130" height="48" rx="8" class="chip"/>
<rect x="48" y="84" width="214" height="32" rx="6" class="a"/>
<text x="58" y="105" class="ta b s12 mono">SOURCE_CANDIDATE</text>
<text x="272" y="105" class="tx s12">a source contains the name, syntax or a candidate relation</text>
<text x="722" y="105" class="mu s12">that the selected build actually uses it</text>
<rect x="40" y="130" width="1130" height="48" rx="8" class="chip"/>
<rect x="48" y="138" width="214" height="32" rx="6" class="a"/>
<text x="58" y="159" class="ta b s12 mono">LSP_RESOLVED</text>
<text x="272" y="159" class="tx s12">the pinned language server's answer for that query on that snapshot</text>
<text x="722" y="159" class="mu s12">independent proof of elaborated connectivity</text>
<rect x="40" y="184" width="1130" height="48" rx="8" class="chip"/>
<rect x="48" y="192" width="214" height="32" rx="6" class="a"/>
<text x="58" y="213" class="ta b s12 mono">HDL_STATIC_RESOLVED</text>
<text x="272" y="213" class="tx s12">slang's resolution for the stated profile, snapshot and scope</text>
<text x="722" y="213" class="mu s12">runtime factory or config_db behaviour, or a simulation PASS</text>
<rect x="40" y="238" width="1130" height="48" rx="8" class="chip"/>
<rect x="48" y="246" width="214" height="32" rx="6" class="chip"/>
<rect x="48" y="246" width="214" height="32" rx="6" class="dash"/>
<text x="58" y="267" class="tx b s12 mono">RUNTIME_OBSERVED</text>
<text x="272" y="267" class="tx s12">what one test, one seed and one run recorded</text>
<text x="722" y="267" class="mu s12">that all tests or seeds behave the same</text>
<rect x="40" y="292" width="1130" height="48" rx="8" class="chip"/>
<rect x="48" y="300" width="214" height="32" rx="6" class="chip"/>
<rect x="48" y="300" width="214" height="32" rx="6" class="dash"/>
<text x="58" y="321" class="tx b s12 mono">EXTERNAL_DECLARED</text>
<text x="272" y="321" class="tx s12">what an outside provider claims, with its artifacts</text>
<text x="722" y="321" class="mu s12">anything SVWeave executed or independently verified</text>
<rect x="40" y="346" width="1130" height="48" rx="8" class="chip"/>
<rect x="48" y="354" width="214" height="32" rx="6" class="n"/>
<text x="58" y="375" class="tx b s12 mono">UNRESOLVED</text>
<text x="272" y="375" class="tx s12">a limit, a gap or a dynamic dependency exists</text>
<text x="722" y="375" class="mu s12">that the dependency does not exist</text>
<text x="40" y="420" class="mu s12">Blue: produced by SVWeave from static analysis. Dashed: only imported, never produced by SVWeave (no trusted runner exists in v1).</text>
<text x="40" y="438" class="mu s12">This is not a ranking: runtime proves one run, static analysis covers code that never ran, and neither replaces the other.</text>
<line x1="40" y1="462" x2="1170" y2="462" class="lf"/>
<text x="40" y="490" class="tx b s16">Release status: static preview gates are kept apart from EDA evidence</text>
<rect x="40" y="504" width="1130" height="46" rx="8" class="n"/>
<text x="52" y="524" class="tx s12">Snapshot of the qualification run of 2026-10-14, not a timeless claim. Source tree sha256 21a97d0c... (git HEAD b6ba45c, +dirty),</text>
<text x="52" y="541" class="tx s12">toolchain lock 5c02676b..., host class Linux x86_64 py3.12.4. Re-run scripts/qualify.py for the current state.</text>
<text x="40" y="584" class="tx b s13">Static preview gates (scripts/qualify.py)</text>
<rect x="40" y="596" width="330" height="40" rx="8" class="dash"/>
<text x="52" y="621" class="tx b s12 mono">G0  PASS_WITH_OWNER_WAIVER_OPEN</text>
<rect x="40" y="646" width="116" height="40" rx="8" class="a"/>
<text x="98" y="671" class="ta b s12 mono" text-anchor="middle">G1  PASS</text>
<rect x="164" y="646" width="116" height="40" rx="8" class="a"/>
<text x="222" y="671" class="ta b s12 mono" text-anchor="middle">G2  PASS</text>
<rect x="288" y="646" width="116" height="40" rx="8" class="a"/>
<text x="346" y="671" class="ta b s12 mono" text-anchor="middle">G3  PASS</text>
<rect x="412" y="646" width="116" height="40" rx="8" class="a"/>
<text x="470" y="671" class="ta b s12 mono" text-anchor="middle">G4  PASS</text>
<rect x="536" y="646" width="116" height="40" rx="8" class="a"/>
<text x="594" y="671" class="ta b s12 mono" text-anchor="middle">G5  PASS</text>
<text x="40" y="710" class="mu s12">G0 lock, probe, sandbox. G1 manifest, snapshot, config, path policy. G2 semantic suites. G3</text>
<text x="40" y="726" class="mu s12">backends and MCP contract. G4 edit safety and critical mutations. G5 P0 suites, acceptance,</text>
<text x="40" y="742" class="mu s12">coverage, docs, benchmark.</text>
<rect x="40" y="760" width="324" height="72" rx="8" class="chip"/>
<text x="52" y="790" class="tx b s16 mono">920 / 0 / 0 / 0</text>
<text x="52" y="814" class="mu s12">P0 tests passed / failed / blocked / skipped</text>
<rect x="380" y="760" width="324" height="72" rx="8" class="chip"/>
<text x="392" y="790" class="tx b s16 mono">22 of 22</text>
<text x="392" y="814" class="mu s12">critical mutations killed, none survived</text>
<rect x="40" y="844" width="324" height="72" rx="8" class="chip"/>
<text x="52" y="874" class="tx b s16 mono">93.58% / 87.71%</text>
<text x="52" y="898" class="mu s12">statement / branch coverage (SVWeave code, not RTL)</text>
<rect x="380" y="844" width="324" height="72" rx="8" class="chip"/>
<text x="392" y="874" class="tx b s16 mono">24.3 s</text>
<text x="392" y="898" class="mu s12">median cold build, 500 files (budget 120 s)</text>
<line x1="715" y1="584" x2="715" y2="940" class="lt"/>
<text x="730" y="584" class="tx b s13">EDA evidence (separate, never merged into the gates)</text>
<rect x="730" y="596" width="440" height="34" rx="8" class="dash"/>
<text x="742" y="618" class="tx b s12">EDA compile</text>
<text x="1158" y="618" class="mu b s12 mono" text-anchor="end">NOT_RUN</text>
<rect x="730" y="638" width="440" height="34" rx="8" class="dash"/>
<text x="742" y="660" class="tx b s12">Simulation</text>
<text x="1158" y="660" class="mu b s12 mono" text-anchor="end">NOT_RUN</text>
<rect x="730" y="680" width="440" height="34" rx="8" class="dash"/>
<text x="742" y="702" class="tx b s12">Formal</text>
<text x="1158" y="702" class="mu b s12 mono" text-anchor="end">NOT_RUN</text>
<text x="730" y="736" class="mu s12">Imported evidence is stored as EXTERNAL_DECLARED and never verified.</text>
<rect x="730" y="760" width="440" height="156" rx="8" class="w"/>
<text x="742" y="784" class="tw b s13">Release decision</text>
<text x="1158" y="784" class="tw b s16 mono" text-anchor="end">BLOCKED</text>
<text x="742" y="810" class="tx s12">Open owner sign-offs (not signed in the evidence):</text>
<text x="742" y="830" class="tx s12">g0_waiver (cbm and Serena DEGRADED, not READY)</text>
<text x="742" y="850" class="tx s12">adr_012 (Serena edits limited to function bodies)</text>
<text x="742" y="870" class="tx s12">license_review (legal review NOT_DONE)</text>
<text x="742" y="900" class="mu s12">ACCEPTED_STATIC_PREVIEW: all gates PASS, no open blocker.</text>
<text x="40" y="964" class="mu s12">Copies: evidence/qualification/report.md and report.json; benchmark evidence/bench/20261014T085609Z-s1.0.json (host differs from the plan reference host).</text>
</svg>
