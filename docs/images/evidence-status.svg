<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="100%" role="img" aria-labelledby="t d">
<title id="t">Evidence kinds and release status</title>
<desc id="d">What each evidence kind can and cannot support, and the release status panel for the 2026-10-14 qualification run: static preview gates G0 to G5 are separate from EDA compile, simulation and formal, which are NOT_RUN.</desc>
