<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" width="100%" role="img" aria-labelledby="t d">
<title id="t">Connecting a design project and an AI client</title>
<desc id="d">Top: installing SVWeave into a target design project, every step idempotent. From the SVWeave checkout three things reach the project: (i) the MCP server registration named svweave, made with claude mcp add svweave -- /ABS/PATH/.venv/bin/svweave --root /ABS/PATH/TO/PROJECT serve --transport stdio (or .mcp.json, or the mcp_servers.svweave table of the Codex config.toml), where --root binds the gateway to that one project; (ii) the specialist agent .claude/agents/svweave-mcp.md, copied from docs/agents/svweave-mcp-specialist.md; (iii) the block between &lt;!-- svweave:begin --&gt; and &lt;!-- svweave:end --&gt; from docs/agents/AGENTS.snippet.md, inserted into the project's AGENTS.md or CLAUDE.md by replacing the old block or appending once. Beforehand the project gets an svweave.yaml workspace and a first build; afterwards /mcp and svw_status check the connection. Bottom: at run time the main agent reads the snippet and routes SystemVerilog structure questions to the svweave-mcp specialist, which calls the mcp__svweave__svw_* tools of one gateway process per client; the gateway answers with one envelope per call. The specialist builds first (svw_status, svw_build, svw_job) and then queries with the build_id. It may prepare, validate and abort an edit with svw_edit when editing is enabled, but it can never approve: a human runs svweave edit approve on a real terminal, and only then can svweave edit commit or svw_edit commit apply the change.</desc>
