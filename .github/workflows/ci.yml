# SVWeave CI (plan 22.1, 23.4).
#
# Rules: no secrets, no self-hosted runners, no pushes/PRs/branch-protection changes (plan 23.4).
# Untrusted PRs only get the fast job; additional validation is manual (workflow_dispatch).
# Network is confined to explicit installation/bootstrap steps. Native source analysis runs
# in the mandatory sandbox. Isolated backend validation is not full release qualification.
#
# PIN BEFORE USE: the `uses:` references below are TAGS for readability. Before this workflow is
# enabled, replace each with the full commit SHA of the reviewed release (for example
# `actions/checkout@<40-hex-sha> # v4.x.y`). Mutable tags are a supply-chain risk (plan 23.1).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      real_backends:
        description: "Run isolated pinned backend validation (not full qualification or release)"
        type: boolean
        default: false
      cleanroom_only:
        description: "With real_backends: DEP-01-R2 offline install + isolated backend validation; not qualification"
        type: boolean
        default: false
      remaining_regressions:
        description: "RETIRED R1-only mode: true fails before setup; use cleanroom_only for revised DEP-01-R2"
        type: boolean
        default: false
      native_verilator:
        description: "Run pinned native Verilator static lint/JSON and importer regressions (no simulation)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast checks (ruff, mypy, schema, unit, contract)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # TODO(pin): actions/checkout -> full commit SHA
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # TODO(pin): actions/setup-python -> full commit SHA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip==24.3.1 uv==0.5.11
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
      - name: Pinned wheels (pyslang, MCP SDK) and tool archives, SHA-256 verified against the lock
        run: .venv/bin/python scripts/bootstrap_locked.py
      - name: Build and smoke-test the installed wheel outside the checkout (no native backends)
        run: |
          # Existing pyproject build-system pin; installation phase only, not a runtime download.
          uv pip install --python .venv/bin/python hatchling==1.29.0
          SVWEAVE_REQUIRE_PACKAGE_BUILD=1 .venv/bin/python -m pytest tests/unit/test_installed_runtime_assets.py -q --no-cov
          .venv/bin/python scripts/ci_wheel_smoke.py
      - name: Upload pure wheel smoke evidence (not backend qualification)
        if: always()
        # TODO(pin): actions/upload-artifact -> full commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: svweave-wheel-smoke
          path: .svweave/ci/wheel-smoke.json
          include-hidden-files: true
          if-no-files-found: warn
      - name: Ruff
        run: .venv/bin/ruff check src tests
      - name: Mypy (strict)
        run: .venv/bin/mypy
      - name: Schemas in sync with the models
        run: .venv/bin/svweave schema emit --check
      - name: Install and verify the mandatory worker sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          .venv/bin/python scripts/ci_prepare_bwrap_apparmor.py
          probe_started_at=$(date -u '+%Y-%m-%d %H:%M:%S.%6N UTC')
          echo "Mandatory worker sandbox probe started: $probe_started_at"
          if .venv/bin/python - <<'PY'
          from svweave.security.sandbox import probe_host

          capability = probe_host(refresh=True)
          if not capability.available:
              raise SystemExit(f"Mandatory worker sandbox unavailable: {capability.reason}")
          print(f"Mandatory worker sandbox ready: {capability.version}")
          PY
          then
            :
          else
            probe_status=$?
            # Diagnostics are bounded and read-only; they never repair or replace this gate.
            timeout 60s bash scripts/ci_sandbox_diagnostics.sh "$probe_started_at" || true
            exit "$probe_status"
          fi
      - name: Unit tests
        run: .venv/bin/python -m pytest tests/unit -q --no-cov
      - name: Contract tests
        run: .venv/bin/python -m pytest tests/contract -q --no-cov
      - name: Paired snapshot I/O benchmark (correctness gate, no speed threshold)
        if: github.event_name == 'workflow_dispatch' && inputs.real_backends && !inputs.cleanroom_only
        timeout-minutes: 10
        run: .venv/bin/python scripts/benchmark_incremental_snapshot.py --files 1000 --trials 5 --out .svweave/ci/incremental-snapshot.json
      - name: Upload snapshot I/O benchmark evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.real_backends && !inputs.cleanroom_only
        uses: actions/upload-artifact@v4
        with:
          name: svweave-incremental-snapshot-evidence
          path: |
            .svweave/ci/incremental-snapshot.json
            .svweave/ci/incremental-snapshot.samples.jsonl
          include-hidden-files: true
          if-no-files-found: warn
      # Real-backend tests skip locally when a backend is missing; in this job they are not run at
      # all, and the fast job NEVER counts as release qualification (scripts/qualify.py does).

  real-backends:
    name: ${{ inputs.cleanroom_only && 'DEP-01-R2 host-controller validation (not qualification)' || 'isolated pinned backend validation (not full qualification)' }}
    if: github.event_name == 'workflow_dispatch' && (inputs.real_backends || inputs.remaining_regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SVWEAVE_REQUIRE_BACKENDS: "1"
    steps:
      - name: Validate bounded regression mode
        run: |
          if [[ '${{ inputs.remaining_regressions }}' == 'true' ]]; then
            echo 'remaining_regressions is retired: R1-only exclusion cannot apply to DEP-01-R2; use cleanroom_only=true with real_backends=true' >&2
            exit 2
          fi
      # TODO(pin): actions/checkout -> full commit SHA
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # TODO(pin): actions/setup-python -> full commit SHA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record exact validation identity
        run: |
          python - <<'PY_IDENTITY'
          import hashlib
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from _bench_common import source_identity
          out = Path(".svweave/ci")
          out.mkdir(parents=True, exist_ok=True)
          identity = {
              "source_identity": source_identity(),
              "git_status": subprocess.check_output(["git", "status", "--porcelain"], text=True),
              "lock_sha256": hashlib.sha256(Path("toolchain.lock.json").read_bytes()).hexdigest(),
              "workflow_sha256": hashlib.sha256(Path(".github/workflows/ci.yml").read_bytes()).hexdigest(),
              "platform": platform.platform(),
              "python": sys.version,
              "scope": "${{ inputs.cleanroom_only && 'DEP-01-R2 host-controller validation only; not qualification' || 'isolated backend validation only; not full qualification, release or EDA simulation' }}",
              "cleanroom_validation_only": "${{ inputs.cleanroom_only }}",
              "dep01_contract_revision": "DEP-01-R2-host-controller",
          }
          (out / "identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          PY_IDENTITY
      - name: Install package and the pinned toolchain (network only here, hashes verified)
        run: |
          python -m pip install --upgrade pip==24.3.1 uv==0.5.11
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
          .venv/bin/python scripts/bootstrap_locked.py
          .venv/bin/python scripts/bootstrap_locked.py --verify-only
      - name: Install and verify the mandatory worker sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          .venv/bin/python scripts/ci_prepare_bwrap_apparmor.py
          probe_started_at=$(date -u '+%Y-%m-%d %H:%M:%S.%6N UTC')
          echo "Mandatory worker sandbox probe started: $probe_started_at"
          if .venv/bin/python - <<'PY'
          from svweave.security.sandbox import probe_host

          capability = probe_host(refresh=True)
          if not capability.available:
              raise SystemExit(f"Mandatory worker sandbox unavailable: {capability.reason}")
          print(f"Mandatory worker sandbox ready: {capability.version}")
          PY
          then
            :
          else
            probe_status=$?
            # Diagnostics are bounded and read-only; they never repair or replace this gate.
            timeout 60s bash scripts/ci_sandbox_diagnostics.sh "$probe_started_at" || true
            exit "$probe_status"
          fi
      - name: Required native probe isolation regressions (fail closed)
        run: |
          .venv/bin/python -m pytest tests/unit/test_ci_probe_isolation.py tests/unit/test_ci_cleanroom_contract.py tests/integration/test_int_probe_isolation.py -q --no-cov --junitxml=.svweave/ci/junit_probe_isolation.xml
      - name: DEP-01 R2 offline-install and isolated-backend validation (not qualification)
        if: ${{ inputs.cleanroom_only }}
        run: |
          probe_started_at=$(date -u '+%Y-%m-%d %H:%M:%S.%6N UTC')
          if .venv/bin/python -m pytest tests/integration/test_dep01_cleanroom.py -q --no-cov --junitxml=.svweave/ci/junit_dep01_r2.xml; then
            :
          else
            probe_status=$?
            probe_finished_at=$(date -u '+%Y-%m-%d %H:%M:%S.%6N UTC')
            # Prefer the current controller preflight interval; reject missing, malformed or stale evidence.
            # A missing interval uses the failed test's bounds, never an extra namespace attempt.
            if probe_window=$(.venv/bin/python - "$probe_started_at" "$probe_finished_at" <<'PY_WINDOW'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          fmt = "%Y-%m-%d %H:%M:%S.%f UTC"
          report = json.loads(Path(".svweave/ci/dep01-r2/controller-sandbox-preflight.json").read_text())
          start, end = (datetime.strptime(report[key], fmt) for key in ("started_at_utc", "finished_at_utc"))
          lower, upper = (datetime.strptime(value, fmt) for value in sys.argv[1:])
          if not lower <= start <= end <= upper:
              raise SystemExit("Preflight interval is outside the failed test; using test bounds")
          print(start.strftime(fmt) + "\t" + end.strftime(fmt))
          PY_WINDOW
            ); then
              IFS=$'\t' read -r probe_started_at probe_finished_at <<< "$probe_window"
            fi
            # Read-only and bounded; diagnostic failure must not replace the original test failure.
            mkdir -p .svweave/ci/dep01-r2 && timeout 60s bash scripts/ci_sandbox_diagnostics.sh "$probe_started_at" "$probe_finished_at" > .svweave/ci/dep01-r2/controller-sandbox-kernel.log 2>&1 || true
            head -c 262144 .svweave/ci/dep01-r2/controller-sandbox-kernel.log || true
            exit "$probe_status"
          fi
      - name: Backend contract probe
        if: ${{ !inputs.cleanroom_only }}
        run: .venv/bin/python scripts/probe_backends.py --out .svweave/ci/capability_report.json
      - name: Integration, fault injection and acceptance (skips are failures)
        if: ${{ !inputs.cleanroom_only }}
        run: |
          .venv/bin/python -m pytest tests/integration tests/fault_injection tests/acceptance -q --no-cov --junitxml=.svweave/ci/junit_required.xml
      - name: Critical mutation suite (plan 20.5)
        if: ${{ !inputs.cleanroom_only }}
        run: .venv/bin/python scripts/mutation_suite.py
      - name: Paired full-build and snapshot-update benchmark (whole-profile semantics)
        if: ${{ !inputs.cleanroom_only }}
        timeout-minutes: 15
        run: .venv/bin/python scripts/benchmark_incremental_build.py --scale 1.0 --pairs 2 --out .svweave/ci/incremental-build.json
      - name: Small-scale benchmark (smoke only; not the plan 22.3 reference run)
        if: ${{ !inputs.cleanroom_only }}
        run: .venv/bin/python scripts/benchmark.py --scale 0.05 --no-graph --cold-runs 5 --hot-runs 30
      - name: Upload validation evidence (not a full qualification)
        if: always()
        # TODO(pin): actions/upload-artifact -> full commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: svweave-evidence
          path: |
            .svweave/ci/
            .svweave/probe/run-*/pyslang_result.json
            .svweave/probe/run-*/slang_cli-*/
            .svweave/probe/run-*/*_stderr.log
            evidence/mutation/
            .svweave/bench/*.json
          include-hidden-files: true
          if-no-files-found: error

  native-verilator:
    name: isolated native Verilator and real-worker semantic validation
    if: github.event_name == 'workflow_dispatch' && inputs.native_verilator
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      SVWEAVE_REQUIRE_BACKENDS: "1"
    steps:
      # TODO(pin): actions/checkout -> full commit SHA
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # TODO(pin): actions/setup-python -> full commit SHA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Record exact validation identity
        run: |
          python - <<'PY_IDENTITY'
          import hashlib
          import json
          import platform
          import subprocess
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from _bench_common import source_identity
          out = Path(".svweave/ci")
          out.mkdir(parents=True, exist_ok=True)
          identity = {
              "source_identity": source_identity(),
              "git_status": subprocess.check_output(["git", "status", "--porcelain"], text=True),
              "lock_sha256": hashlib.sha256(Path("toolchain.lock.json").read_bytes()).hexdigest(),
              "workflow_sha256": hashlib.sha256(Path(".github/workflows/ci.yml").read_bytes()).hexdigest(),
              "platform": platform.platform(),
              "python": sys.version,
              "scope": "targeted static validation only; not full qualification or simulation",
          }
          (out / "identity.json").write_text(json.dumps(identity, indent=2) + "\n")
          PY_IDENTITY
      - name: Install package and pinned analysis toolchain
        run: |
          python -m pip install --upgrade pip==24.3.1 uv==0.5.11
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e '.[dev]'
          .venv/bin/python scripts/bootstrap_locked.py
          .venv/bin/python scripts/bootstrap_locked.py --verify-only
      - name: Install and verify the mandatory worker sandbox
        id: mandatory_sandbox
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          .venv/bin/python scripts/ci_prepare_bwrap_apparmor.py
          probe_started_at=$(date -u '+%Y-%m-%d %H:%M:%S.%6N UTC')
          echo "Mandatory worker sandbox probe started: $probe_started_at"
          if .venv/bin/python - <<'PY'
          from svweave.security.sandbox import probe_host

          capability = probe_host(refresh=True)
          if not capability.available:
              raise SystemExit(f"Mandatory worker sandbox unavailable: {capability.reason}")
          print(f"Mandatory worker sandbox ready: {capability.version}")
          PY
          then
            :
          else
            probe_status=$?
            # Diagnostics are bounded and read-only; they never repair or replace this gate.
            timeout 60s bash scripts/ci_sandbox_diagnostics.sh "$probe_started_at" || true
            exit "$probe_status"
          fi
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf flex bison help2man perl python3 make g++ git libfl-dev zlib1g-dev
      - name: Build official pinned Verilator inside mandatory network-disabled sandbox
        run: |
          .venv/bin/python scripts/bootstrap_verilator.py --destination "$RUNNER_TEMP/svweave-verilator-5.052" --output evidence/verilator-native-bootstrap
      - name: Verify actual Verilator lint, JSON and importer query (no simulation)
        run: |
          .venv/bin/python scripts/verify_verilator_native.py --verilator-root "$RUNNER_TEMP/svweave-verilator-5.052" --output evidence/verilator-native
      - name: Required real-worker semantic and pinned UVM regressions
        if: ${{ !cancelled() && steps.mandatory_sandbox.outcome == 'success' }}
        run: |
          .venv/bin/python -m pytest tests/integration/test_reference_coverage.py tests/integration/test_sem.py tests/integration/test_repo_profiles.py tests/integration/test_uvm.py -q --no-cov --junitxml=.svweave/ci/junit_semantic_uvm.xml
      - name: Required CI gates and supplement regressions
        if: ${{ !cancelled() && steps.mandatory_sandbox.outcome == 'success' }}
        run: |
          .venv/bin/python -m pytest tests/unit/test_ci_sandbox_gate.py tests/unit/test_ci_bwrap_apparmor.py tests/unit/test_ci_qualification.py tests/unit/test_ci_required_backends.py tests/unit/test_verilator_importer.py tests/unit/test_supplement_application.py tests/unit/test_uvm_call_metadata.py tests/unit/test_verilator_native_harness.py tests/unit/test_reference_coverage.py tests/unit/test_semantic_envelope.py tests/unit/test_slang_ingest.py tests/unit/test_impact_pure.py tests/unit/test_rename_pure.py -q --no-cov --junitxml=.svweave/ci/junit_gates_supplement.xml
      - name: Upload exact-source native and semantic validation evidence
        if: always()
        # TODO(pin): actions/upload-artifact -> full commit SHA
        uses: actions/upload-artifact@v4
        with:
          name: svweave-native-verilator-evidence
          path: |
            .svweave/ci/
            evidence/verilator-native-bootstrap/
            evidence/verilator-native/
          include-hidden-files: true
          if-no-files-found: error
